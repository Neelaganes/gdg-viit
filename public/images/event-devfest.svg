<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="dots-devfest" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#111111" fill-opacity="0.18" />
    </pattern>
    <pattern id="grid-devfest" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#111111" stroke-width="1.5" stroke-opacity="0.12" />
    </pattern>
  </defs>

  <!-- Cream Base + Grid -->
  <rect width="800" height="600" fill="#FFF8E7" />
  <rect width="800" height="600" fill="url(#grid-devfest)" />

  <!-- Large Blue Geometric Backdrop Block -->
  <rect x="44" y="44" width="720" height="520" fill="#111111" />
  <rect x="34" y="34" width="720" height="520" fill="#4285F4" stroke="#111111" stroke-width="5" />

  <!-- Halftone Overlay Corner -->
  <rect x="480" y="34" width="274" height="240" fill="url(#dots-devfest)" />

  <!-- Sunburst / Stage Beams -->
  <polygon points="394,320 120,34 260,34" fill="#FBBC04" stroke="#111111" stroke-width="4" />
  <polygon points="394,320 520,34 670,34" fill="#EA4335" stroke="#111111" stroke-width="4" />
  <polygon points="394,320 754,160 754,300" fill="#34A853" stroke="#111111" stroke-width="4" />

  <!-- Top Status Bar -->
  <rect x="64" y="64" width="250" height="42" fill="#FFF8E7" stroke="#111111" stroke-width="4" />
  <circle cx="88" cy="85" r="8" fill="#EA4335" stroke="#111111" stroke-width="3" />
  <circle cx="112" cy="85" r="8" fill="#FBBC04" stroke="#111111" stroke-width="3" />
  <circle cx="136" cy="85" r="8" fill="#34A853" stroke="#111111" stroke-width="3" />
  <text x="160" y="91" font-family="monospace" font-weight="900" font-size="16" fill="#111111">VIIT // VIZAG</text>

  <!-- Rotated Yellow Sticker -->
  <g transform="translate(560, 78) rotate(5)">
    <rect x="6" y="6" width="164" height="52" fill="#111111" />
    <rect x="0" y="0" width="164" height="52" fill="#FBBC04" stroke="#111111" stroke-width="4" />
    <text x="82" y="33" text-anchor="middle" font-family="monospace" font-weight="900" font-size="20" fill="#111111">FLAGSHIP '26</text>
  </g>

  <!-- Central Stage / Giant Code Terminal Card -->
  <rect x="92" y="148" width="620" height="270" fill="#111111" />
  <rect x="80" y="136" width="620" height="270" fill="#FFF8E7" stroke="#111111" stroke-width="5" />
  <rect x="80" y="136" width="620" height="38" fill="#111111" />
  <text x="100" y="161" font-family="monospace" font-weight="700" font-size="16" fill="#FFF8E7">&lt;gdg-viit/devfest-2026.sh&gt;</text>

  <!-- Big GDG Angle Brackets Graphic inside Terminal -->
  <!-- Left Bracket -->
  <g transform="translate(155, 225)">
    <g transform="rotate(-32)">
      <rect x="5" y="5" width="78" height="28" rx="6" fill="#111111" />
      <rect x="0" y="0" width="78" height="28" rx="6" fill="#EA4335" stroke="#111111" stroke-width="4" />
    </g>
    <g transform="translate(0, 38) rotate(32)">
      <rect x="5" y="5" width="78" height="28" rx="6" fill="#111111" />
      <rect x="0" y="0" width="78" height="28" rx="6" fill="#4285F4" stroke="#111111" stroke-width="4" />
    </g>
  </g>

  <!-- Center Poster Typography -->
  <text x="395" y="255" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="64" letter-spacing="-2" fill="#111111">DEVFEST</text>
  <rect x="255" y="274" width="280" height="48" fill="#34A853" stroke="#111111" stroke-width="4" />
  <text x="395" y="307" text-anchor="middle" font-family="monospace" font-weight="900" font-size="28" fill="#111111">VIIT CAMPUS 2026</text>
  <text x="395" y="362" text-anchor="middle" font-family="monospace" font-weight="700" font-size="17" fill="#111111">AI • CLOUD • ANDROID • WEB • FLUTTER</text>

  <!-- Right Bracket -->
  <g transform="translate(565, 225)">
    <g transform="rotate(32)">
      <rect x="5" y="5" width="78" height="28" rx="6" fill="#111111" />
      <rect x="0" y="0" width="78" height="28" rx="6" fill="#34A853" stroke="#111111" stroke-width="4" />
    </g>
    <g transform="translate(0, 38) rotate(-32)">
      <rect x="5" y="5" width="78" height="28" rx="6" fill="#111111" />
      <rect x="0" y="0" width="78" height="28" rx="6" fill="#FBBC04" stroke="#111111" stroke-width="4" />
    </g>
  </g>

  <!-- Crowd & Laptops Silhouette Row at Bottom -->
  <g transform="translate(64, 434)">
    <!-- Speaker Podium & Crowd -->
    <rect x="8" y="8" width="200" height="96" fill="#111111" />
    <rect x="0" y="0" width="200" height="96" fill="#EA4335" stroke="#111111" stroke-width="4" />
    <text x="20" y="38" font-family="monospace" font-weight="900" font-size="22" fill="#FFF8E7">12+ SPEAKERS</text>
    <text x="20" y="68" font-family="monospace" font-weight="700" font-size="15" fill="#FFF8E7">GDEs &amp; INDUSTRY PROS</text>

    <rect x="234" y="8" width="200" height="96" fill="#111111" />
    <rect x="226" y="0" width="200" height="96" fill="#FBBC04" stroke="#111111" stroke-width="4" />
    <text x="246" y="38" font-family="monospace" font-weight="900" font-size="22" fill="#111111">600+ BUILDERS</text>
    <text x="246" y="68" font-family="monospace" font-weight="700" font-size="15" fill="#111111">2 FULL DAYS OF CODE</text>

    <rect x="460" y="8" width="200" height="96" fill="#111111" />
    <rect x="452" y="0" width="200" height="96" fill="#34A853" stroke="#111111" stroke-width="4" />
    <text x="472" y="38" font-family="monospace" font-weight="900" font-size="22" fill="#111111">LIVE LABS</text>
    <text x="472" y="68" font-family="monospace" font-weight="700" font-size="15" fill="#111111">SWAG • PRIZES • DEMO</text>
  </g>
</svg>
