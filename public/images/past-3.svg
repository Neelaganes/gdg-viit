<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440">
  <defs>
    <pattern id="dots-p3" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#111111" fill-opacity="0.18" />
    </pattern>
  </defs>
  <rect width="640" height="440" fill="#34A853" />
  <rect x="0" y="220" width="640" height="220" fill="url(#dots-p3)" />
  <rect x="24" y="24" width="592" height="392" fill="none" stroke="#111111" stroke-width="5" />

  <!-- Poster Card -->
  <rect x="58" y="62" width="532" height="324" fill="#111111" />
  <rect x="48" y="52" width="532" height="324" fill="#FFF8E7" stroke="#111111" stroke-width="5" />

  <!-- Stage Mic / Soundwave Graphic -->
  <g transform="translate(80, 100)">
    <rect x="6" y="6" width="160" height="220" fill="#111111" />
    <rect x="0" y="0" width="160" height="220" fill="#FBBC04" stroke="#111111" stroke-width="4" />
    <!-- Microphone head -->
    <rect x="52" y="34" width="56" height="84" rx="28" fill="#EA4335" stroke="#111111" stroke-width="4" />
    <line x1="52" y1="62" x2="108" y2="62" stroke="#111111" stroke-width="4" />
    <line x1="52" y1="84" x2="108" y2="84" stroke="#111111" stroke-width="4" />
    <!-- Mic Cradle & Stand -->
    <path d="M 36 84 C 36 144, 124 144, 124 84" fill="none" stroke="#111111" stroke-width="6" />
    <line x1="80" y1="132" x2="80" y2="186" stroke="#111111" stroke-width="6" />
    <rect x="40" y="184" width="80" height="16" fill="#111111" />
  </g>

  <!-- Right Copy -->
  <g transform="translate(274, 102)">
    <rect x="0" y="0" width="270" height="40" fill="#4285F4" stroke="#111111" stroke-width="4" />
    <text x="135" y="26" text-anchor="middle" font-family="monospace" font-weight="900" font-size="17" fill="#FFF8E7">AUDITORIUM SESSION</text>

    <text x="0" y="96" font-family="sans-serif" font-weight="900" font-size="48" fill="#111111">TECH TALK</text>
    <text x="0" y="140" font-family="sans-serif" font-weight="900" font-size="32" fill="#EA4335">ANDROID &amp; GEMINI NANO</text>

    <rect x="6" y="168" width="264" height="54" fill="#111111" />
    <rect x="0" y="162" width="264" height="54" fill="#34A853" stroke="#111111" stroke-width="4" />
    <text x="132" y="196" text-anchor="middle" font-family="monospace" font-weight="900" font-size="18" fill="#111111">LIVE CODE + Q&amp;A PANEL</text>
  </g>
</svg>
